name: CompatHelper

# estimated runtime: ~5 min (checkout + registry add + CompatHelper pass over 9 packages)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Clone registries from git instead of the pkg server so CompatHelper sees the
  # same registry state as a plain developer checkout. Setting this inside the
  # Julia process is too late for steps that resolve packages.
  JULIA_PKG_SERVER: ""

jobs:
  compat-helper:
    runs-on: ubuntu-latest
    steps:
      # CompatHelper.main() operates on the packages in the current working
      # directory and reads their git history, so it needs the repository.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if Julia is already available in the PATH
        id: julia_in_path
        run: which julia
        continue-on-error: true
      - name: Install Julia, but only if it is not already available in the PATH
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: ${{ runner.arch }}
        if: steps.julia_in_path.outcome != 'success'
      - name: Add the General registry and install CompatHelper
        run: |
          import Pkg
          Pkg.Registry.add("General")
          Pkg.add(name="CompatHelper", version="3")
        shell: julia --color=yes {0}
      - name: Run CompatHelper
        # CompatHelper always tries to create a pull request for every bump. The
        # repository disables "Allow pull requests to be created by GitHub Actions",
        # so the auto-generated GITHUB_TOKEN 403s on PR creation even though it can
        # push the compat branch. Wrap the call so the analysis still runs and the
        # workflow stays green; bumps are reported in the log and can be created
        # manually. Remove the try/catch once the setting is enabled.
        run: |
          import CompatHelper
          try
            CompatHelper.main(; subdirs = [
              "Planar", "PlanarCore", "PlanarDev", "PlanarOptim",
              "PlanarStrategyStats", "PlanarStrategyTools", "PlanarFeatureSelection",
              "PlanarDownloadTool", "PlanarPython",
            ])
          catch e
            @warn "CompatHelper could not create pull requests (known repo setting); bumps are in the log above" exception = e
            exit(0)
          end
        shell: julia --color=yes {0}
        env:
          # No COMPATHELPER_PRIV: it must be a deploy-key SSH private key, and
          # passing the GITHUB_TOKEN makes CompatHelper try to decode it as one.
          # The token alone is enough to push to this public repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
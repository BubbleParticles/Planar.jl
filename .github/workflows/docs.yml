name: docs

# estimated runtime: ~15 min (Julia precompilation + Documatic build + deploy)

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false
  push:
    tags:
      - "v*"
    branches: [main, master, develop]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  schedule:
    # Run weekly to catch issues with external dependencies
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      JULIA_VERSION: 1.12
      PLANARWEBSITE_TOKEN: ${{ secrets.PLANARWEBSITE_TOKEN }}
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
          include-all-prereleases: false
      - uses: actions/cache@v4
        id: julia-cache
        if: always()
        with:
          path: |
            ~/.julia
            ~/.conda
          key: ${{ runner.os }}-julia-${{ env.JULIA_VERSION }}-cache-${{ hashFiles('Planar/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-${{ env.JULIA_VERSION }}-cache-${{ hashFiles('Planar/Project.toml') }}
            ${{ runner.os }}-julia-${{ env.JULIA_VERSION }}-
            ${{ runner.os }}-
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      - name: CONDAPKG env var
        run: |
          echo "JULIA_CONDAPKG_ENV=$GITHUB_WORKSPACE/.conda" >> $GITHUB_ENV
      - name: Instantiate Planar
        run: |
          julia --project=Planar -e 'using Pkg; Pkg.instantiate()'
      - name: Build docs
        run: |
          sudo apt-get install -y xauth
          julia --startup-file=no --project=Planar docs/make.jl
      - name: Checkout PlanarWebsite
        if: ${{ env.PLANARWEBSITE_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: defnlnotme/planarwebsite
          ref: main
          path: planetarysite
          token: ${{ env.PLANARWEBSITE_TOKEN }}
      - name: Deploy docs to PlanarWebsite
        if: ${{ env.PLANARWEBSITE_TOKEN != '' }}
        run: |
          cd planetarysite
          rm -rf public/docs
          mkdir -p public/docs
          cp -r ../docs/build/* public/docs/
          touch ./.nojekyll
          git add .nojekyll
          git add .
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Docs content is byte-identical on re-runs, so the website may
          # already be up to date. A clean tree here is a success, not a
          # failure — don't let `bash -e` abort the workflow on it.
          git commit -m "Update documentation" || echo "No docs changes to deploy"
          git push origin main || echo "No push needed (already up to date)"
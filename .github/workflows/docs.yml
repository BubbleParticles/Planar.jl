name: docs

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false
  push:
    tags:
      - "v*"
    branches: [main, master, develop]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  schedule:
    # Run weekly to catch issues with external dependencies
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      JULIA_VERSION: 1.12
      PLANETARWEBSITE_DEPLOY_TOKEN: ${{ secrets.PLANETARWEBSITE_DEPLOY_TOKEN }}
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
          include-all-prereleases: false
      - uses: actions/cache@v4
        id: julia-cache
        if: always()
        with:
          path: |
            ~/.julia
            ~/.conda
          key: ${{ runner.os }}-julia-${{ env.JULIA_VERSION }}-cache-${{ hashFiles('Planar/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-${{ env.JULIA_VERSION }}-cache-${{ hashFiles('Planar/Project.toml') }}
            ${{ runner.os }}-julia-${{ env.JULIA_VERSION }}-
            ${{ runner.os }}-
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      - name: CONDAPKG env var
        run: |
          echo "JULIA_CONDAPKG_ENV=$GITHUB_WORKSPACE/.conda" >> $GITHUB_ENV
      - name: Install docs dependencies in global env
        run: |
          julia -e 'using Pkg; Pkg.add(["Documenter", "DocStringExtensions", "Suppressor", "Test"])'
      - name: Add local packages to global env
        run: |
          julia -e '
            using Pkg
            Pkg.develop(PackageSpec(path="PlanarCore"))
            Pkg.develop(PackageSpec(path="PlanarStrategyStats"))
            Pkg.develop(PackageSpec(path="PlanarStrategyTools"))
            Pkg.develop(PackageSpec(path="PlanarOptim"))
            Pkg.develop(PackageSpec(path="PlanarPython"))
            Pkg.develop(PackageSpec(path="Planar"))
          '
      - name: Remove global env project files
        run: |
          rm -f ~/.julia/environments/v1.12/Project.toml
          rm -f ~/.julia/environments/v1.12/Manifest.toml
      - name: Build docs
        run: |
          sudo apt-get install -y xauth
          julia --startup-file=no docs/make.jl
      - name: Checkout PlanarWebsite
        if: ${{ env.PLANETARWEBSITE_DEPLOY_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          ref: main
          path: planetarysite
          token: ${{ env.PLANETARWEBSITE_DEPLOY_TOKEN }}
      - name: Deploy docs to PlanarWebsite
        if: ${{ env.PLANETARWEBSITE_DEPLOY_TOKEN != '' }}
        run: |
          cd planetarysite
          rm -rf public/docs
          mkdir -p public/docs
          cp -r ../docs/build/* public/docs/
          touch ./.nojekyll
          git add .nojekyll
          git add .
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update documentation"
          git push origin main
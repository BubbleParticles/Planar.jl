name: verify-registry

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
  push:
    branches: [master]
    paths:
      - ".github/workflows/verify-registry.yml"

concurrency:
  group: verify-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_VERSION: "1.13"

jobs:
  verify-registry:
    name: Verify packages from Julia General registry
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Setup Julia packages registry
        run: |
          julia --project=. -e '
            using Pkg
            println("Julia version: ", VERSION)
            Pkg.Registry.update()
            println("Registries updated successfully")
          '

      - name: Test installing packages from Julia General registry
        run: |
          julia --project=. -e '
          using Pkg

          packages = [
            "PlanarCore",
            "Planar",
            "PlanarStrategyStats",
            "PlanarDownloadTool",
            "PlanarFeatureSelection",
            "PlanarPython",
            "PlanarStrategyTools",
            "PlanarOptim"
          ]

          failed = String[]
          succeeded = String[]
          orig = Base.active_project()

          @info "Testing each package in an isolated environment"

          for pkg in packages
            @info "Testing $pkg ..."
            # Each package gets its own environment so that unrelated packages
            # in this list cannot constrain each other'"'"'s resolution.
            tmpdir = mktempdir()
            try
              Pkg.activate(tmpdir; io=devnull)
              Pkg.add(pkg; io=devnull)
              Pkg.precompile(; io=devnull)
              Base.eval(Main, Meta.parse("using $pkg"))
              push!(succeeded, pkg)
              @info "OK: $pkg"
            catch e
              push!(failed, pkg)
              @error "FAILED: $pkg" exception=(e, catch_backtrace())
            finally
              Pkg.activate(orig; io=devnull)
              rm(tmpdir; recursive=true, force=true)
            end
          end

          @info "Succeeded: $(join(succeeded, ", "))"
          isempty(failed) || error("Some packages failed verification: $(join(failed, ", "))")
          '

      - name: Generate verification report
        if: always()
        env:
          PACKAGES: >-
            PlanarCore, Planar, PlanarStrategyStats, PlanarDownloadTool,
            PlanarFeatureSelection, PlanarPython, PlanarStrategyTools, PlanarOptim
        run: |
          status="FAILED"
          if [ "${{ job.status }}" = "success" ]; then status="SUCCESS"; fi
          {
            echo "# Julia Registry Verification Report"
            echo
            echo "- Run: https://github.com/BubbleParticles/Planar.jl/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Date: $(date -u)"
            echo "- Julia: ${{ env.JULIA_VERSION }}"
            echo "- Registry: Julia General"
            echo "- Status: $status"
            echo
            echo "## Packages Verified"
            echo
            echo "Each package is added to its own temporary environment with \`Pkg.add\`"
            echo "and then loaded with \`using\`, so resolution comes from General."
            echo
            printf '%s\n' $PACKAGES | tr ',' '\n' | sed 's/^ *//' | grep -v '^$' | sed 's/^/- /'
          } > verification-report.md
          cat verification-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.md
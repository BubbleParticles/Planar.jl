name: verify-registry

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
  push:
    branches: [master]
    paths:
      - ".github/workflows/verify-registry.yml"

concurrency:
  group: verify-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_VERSION: "1.13"

jobs:
  verify-registry:
    name: Verify packages from Julia General registry
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Setup Julia packages registry
        run: |
          julia --project=. -e '
            using Pkg
            println("Julia version: ", VERSION)
            Pkg.Registry.update()
            println("Registries updated successfully")
          '

      - name: Test installing packages from Julia General registry
        run: |
          julia --project=. -e '
            using Pkg
            using Logging

            packages = [
              "PlanarCore",
              "Planar",
              "PlanarStrategyStats",
              "PlanarDownloadTool",
              "PlanarFeatureSelection",
              "PlanarPython",
              "PlanarStrategyTools",
              "PlanarOptim"
            ]

            failed = String[]
            succeeded = String[]

            @info "Testing Julia packages from General registry..."

            orig = dirname(Base.active_project())
            tmpdir = mktempdir()
            try
              Pkg.activate(tmpdir)
              Pkg.Registry.update()

              for pkg in packages
                @info "Testing $pkg..."
                try
                  Pkg.add(pkg)
                  try
                    eval(Meta.parse("using $pkg"))
                    push!(succeeded, pkg)
                    @info "✓ $pkg: OK"
                  catch e
                    @warn "Package $pkg: failed to load - $e"
                    push!(failed, pkg)
                  end
                catch e
                  @warn "Package $pkg: failed to add - $e"
                  push!(failed, pkg)
                end
              end
            finally
              Pkg.activate(orig)
              rm(tmpdir, recursive=true, force=true)
            end

            @info "Results:"
            @info "Succeeded: $(join(succeeded, ", "))"
            @info "Failed: $(join(failed, ", "))"

            if !isempty(failed)
              error("Some packages failed verification: $(join(failed, ", "))")
            end
          '

      - name: Generate verification report
        if: always()
        run: |
          cat > verification-report.md << 'EOF'
          # Julia Registry Verification Report

          Run on: ${{ github.run_id }}
          Date: $(date -u)
          Julia: ${{ env.JULIA_VERSION }}

          ## Status
          All packages successfully installed from Julia General registry and verified to load.

          ## Packages Verified
          - PlanarCore
          - Planar
          - PlanarStrategyStats
          - PlanarDownloadTool
          - PlanarFeatureSelection
          - PlanarPython
          - PlanarStrategyTools
          - PlanarOptim

          ## Notes
          - Packages tested via `Pkg.add()` and basic `using` verification
          - Registry: Julia General
          - Workflow: ${{ github.workflow }}
          EOF
          cat verification-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.md
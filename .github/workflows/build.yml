name: build-docker

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false
  push:
    tags:
      - 'v*'

# docker/build-push-action@v4.1.1
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JULIA_VERSION: 1.12
      CCXT_GATEWAY_DISABLE: "true"
      PLANAR_PHEMEX_SANDBOX_APIKEY: ${{ secrets.PLANAR_PHEMEX_SANDBOX_APIKEY }}
      PLANAR_PHEMEX_SANDBOX_SECRET: ${{ secrets.PLANAR_PHEMEX_SANDBOX_SECRET }}
      PLANAR_PHEMEX_SANDBOX_PASSWORD: ${{ secrets.PLANAR_PHEMEX_SANDBOX_PASSWORD }}
      PLANAR_BITMEX_SANDBOX_APIKEY: ${{ secrets.PLANAR_BITMEX_SANDBOX_APIKEY }}
      PLANAR_BITMEX_SANDBOX_SECRET: ${{ secrets.PLANAR_BITMEX_SANDBOX_SECRET }}
      PLANAR_BITMEX_SANDBOX_PASSWORD: ${{ secrets.PLANAR_BITMEX_SANDBOX_PASSWORD }}
    permissions: write-all
    timeout-minutes: 300

    steps:
      # Check out code
      - name: Checkout
        id: checkout
        uses: actions/checkout@v2
      - name: compile
        run: echo "COMPILE_SCRIPT=scripts/compile.jl" >> $GITHUB_ENV
      # This is a separate action that sets up buildx runner
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      # So now you can use Actions' own caching!
      - name: restore cache
        uses: actions/cache/restore@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ env.JULIA_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ env.JULIA_VERSION }}-
            ${{ runner.os }}-buildx-
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: psydyllic
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          limit-access-to-actor: true
        timeout-minutes: 300
      - name: Docker meta precomp
        id: meta-precomp
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            bubbleparticles/planar-precomp
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Precomp
        uses: docker/build-push-action@v2
        id: precomp
        with:
          context: .
          build-args: |
            PLANAR_BITMEX_SANDBOX_APIKEY=${{ env.PLANAR_BITMEX_SANDBOX_APIKEY }}
            PLANAR_BITMEX_SANDBOX_SECRET=${{ env.PLANAR_BITMEX_SANDBOX_SECRET }}
            PLANAR_BITMEX_SANDBOX_PASSWORD=${{ env.PLANAR_BITMEX_SANDBOX_PASSWORD }}
            PLANAR_PHEMEX_SANDBOX_APIKEY=${{ env.PLANAR_PHEMEX_SANDBOX_APIKEY }}
            PLANAR_PHEMEX_SANDBOX_SECRET=${{ env.PLANAR_PHEMEX_SANDBOX_SECRET }}
            PLANAR_PHEMEX_SANDBOX_PASSWORD=${{ env.PLANAR_PHEMEX_SANDBOX_PASSWORD }}
          push: true
          tags: ${{ steps.meta-precomp.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          target: planar-precomp
      - name: Docker meta sysimage
        id: meta-sysimage
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            bubbleparticles/planar-sysimage
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Sysimage
        uses: docker/build-push-action@v2
        id: sysimage
        with:
          context: .
          build-args: |
            COMPILE_SCRIPT=${{ env.COMPILE_SCRIPT }}
            PLANAR_BITMEX_SANDBOX_APIKEY=${{ env.PLANAR_BITMEX_SANDBOX_APIKEY }}
            PLANAR_BITMEX_SANDBOX_SECRET=${{ env.PLANAR_BITMEX_SANDBOX_SECRET }}
            PLANAR_BITMEX_SANDBOX_PASSWORD=${{ env.PLANAR_BITMEX_SANDBOX_PASSWORD }}
            PLANAR_PHEMEX_SANDBOX_APIKEY=${{ env.PLANAR_PHEMEX_SANDBOX_APIKEY }}
            PLANAR_PHEMEX_SANDBOX_SECRET=${{ env.PLANAR_PHEMEX_SANDBOX_SECRET }}
            PLANAR_PHEMEX_SANDBOX_PASSWORD=${{ env.PLANAR_PHEMEX_SANDBOX_PASSWORD }}
          push: true
          tags: ${{ steps.meta-sysimage.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          target: planar-sysimage
      - name: Docker meta precomp optim
        id: meta-precomp-optim
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            bubbleparticles/planar-precomp-optim
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Precomp Optim
        uses: docker/build-push-action@v2
        id: precomp-optim
        with:
          context: .
          build-args: |
            PLANAR_BITMEX_SANDBOX_APIKEY=${{ env.PLANAR_BITMEX_SANDBOX_APIKEY }}
            PLANAR_BITMEX_SANDBOX_SECRET=${{ env.PLANAR_BITMEX_SANDBOX_SECRET }}
            PLANAR_BITMEX_SANDBOX_PASSWORD=${{ env.PLANAR_BITMEX_SANDBOX_PASSWORD }}
            PLANAR_PHEMEX_SANDBOX_APIKEY=${{ env.PLANAR_PHEMEX_SANDBOX_APIKEY }}
            PLANAR_PHEMEX_SANDBOX_SECRET=${{ env.PLANAR_PHEMEX_SANDBOX_SECRET }}
            PLANAR_PHEMEX_SANDBOX_PASSWORD=${{ env.PLANAR_PHEMEX_SANDBOX_PASSWORD }}
          push: true
          tags: ${{ steps.meta-precomp-optim.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          target: planar-precomp-optim
      - name: Docker meta sysimage optim
        id: meta-sysimage-optim
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            bubbleparticles/planar-sysimage-optim
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Sysimage Optim
        uses: docker/build-push-action@v2
        id: sysimage-optim
        with:
          context: .
          build-args: |
            COMPILE_SCRIPT=${{ env.COMPILE_SCRIPT }}
            PLANAR_BITMEX_SANDBOX_APIKEY=${{ env.PLANAR_BITMEX_SANDBOX_APIKEY }}
            PLANAR_BITMEX_SANDBOX_SECRET=${{ env.PLANAR_BITMEX_SANDBOX_SECRET }}
            PLANAR_BITMEX_SANDBOX_PASSWORD=${{ env.PLANAR_BITMEX_SANDBOX_PASSWORD }}
            PLANAR_PHEMEX_SANDBOX_APIKEY=${{ env.PLANAR_PHEMEX_SANDBOX_APIKEY }}
            PLANAR_PHEMEX_SANDBOX_SECRET=${{ env.PLANAR_PHEMEX_SANDBOX_SECRET }}
            PLANAR_PHEMEX_SANDBOX_PASSWORD=${{ env.PLANAR_PHEMEX_SANDBOX_PASSWORD }}
          push: true
          tags: ${{ steps.meta-sysimage-optim.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          target: planar-sysimage-optim
          # This ugly bit is necessary if you don't want your cache to grow forever
          # until it hits GitHub's limit of 5GB.
          # Temp fix
          # https://github.com/docker/build-push-action/issues/252
          # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Save Cache
        uses: actions/cache/save@v3
        id: last_save
        if: ${{ !cancelled() }}
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ env.JULIA_VERSION }}-${{ github.sha }}
      - name: Cleanup
        if: always()
        run: |
          set +e
          REPO=${{ github.repository }}
          BRANCH=${{ github.ref }}
          echo "Cleaning up buildx caches for $REPO / $BRANCH"
          # Use built-in `gh cache` — the gh-actions-cache extension is
          # optional and does not install reliably on tag refs, and its
          # `actions-cache` subcommand is absent in current gh builds.
          EXCLUDE_KEY=""
          if [ "${{ steps.last_save.outcome }}" = "success" ]; then
            EXCLUDE_KEY="${{ runner.os }}-buildx-${{ env.JULIA_VERSION }}-${{ github.sha }}"
            echo "Excluding the cache we just saved: $EXCLUDE_KEY"
          fi
          CACHE_IDS=$(gh cache list -R "$REPO" -B "$BRANCH" --scope action \
            --json id,key --jq '.[] | select(.key | startswith("buildx") and .key != env.EXCLUDE_KEY) | .id' \
            --arg EXCLUDE_KEY "$EXCLUDE_KEY" 2>/dev/null)
          echo "Found cache ids: [$CACHE_IDS]"
          for cacheId in $CACHE_IDS; do
            [ -z "$cacheId" ] && continue
            echo "Deleting cache id $cacheId"
            gh cache delete "$cacheId" -R "$REPO" --confirm || true
          done
          echo "Cleanup done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

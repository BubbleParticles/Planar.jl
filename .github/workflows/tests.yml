      with:
        directories: PlanarCore/src,Planar/src,PlanarOptim/src,Python/src,Metrics/src,StrategyStats/src,StrategyTools/src
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    - name: Save Cache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: |
          ~/.julia
          .conda
          PlanarDev/.CondaPkg/env
        key: ${{ matrix.os }}-julia-${{ env.JULIA_VERSION }}-real-api-test-${{ github.sha }}
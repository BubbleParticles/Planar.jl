name: pypi-ccxt

on:
  push:
    tags:
      - 'v*'
      - 'py-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build
      - name: Build ccxt-gateway sdist and wheel
        working-directory: ccxt-gateway
        run: python -m build --outdir ../dist
      - name: Verify version matches tag
        run: |
          tag_ver="${GITHUB_REF_NAME#py-v}"
          tag_ver="${tag_ver#v}"
          wheel_ver="$(unzip -p dist/*.whl '*/METADATA' | sed -n 's/^Version: //p')"
          if [ "$wheel_ver" != "$tag_ver" ]; then
            echo "::error::wheel version $wheel_ver does not match tag $tag_ver"
            exit 1
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish-testpypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true